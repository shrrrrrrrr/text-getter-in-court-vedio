[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "court-transcript"
version = "0.3.1"
description = "Evidence-linked verbatim court video transcription workspace"
requires-python = ">=3.10,<3.14"
dependencies = ["fastapi>=0.162,<1", "starlette>=1.3.1,<2", "uvicorn>=0.30,<1", "python-multipart>=0.0.30,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
local = ["faster-whisper==1.2.1", "av>=14,<17", "soundfile>=0.13,<1", "numpy>=2,<3"]
diarization = ["pyannote.audio>=4,<5"]
overlap = ["speechbrain>=1.0.3,<2"]
tencent = ["tencentcloud-sdk-python-asr>=3,<4"]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["court_transcript"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
